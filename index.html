<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f2a541'/%3E%3Cpath d='M16 46.5A5 5 0 0 1 21 41.5H45' stroke='%231a1206' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M21 15h24v34H21A5 5 0 0 1 16 44V20a5 5 0 0 1 5-5z' stroke='%231a1206' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg: #0b0e1c;
    --panel: #161b32;
    --panel-2: #1e2444;
    --line: #2b3157;
    --amber: #f2a541;
    --amber-2: #ffc670;
    --amber-dim: #f2a54120;
    --ivory: #f4efe4;
    --muted: #8891bb;
    --danger: #e2685b;
    --good: #6bcf9a;
    --radius: 18px;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 15% -10%, #2a3266 0%, transparent 40%),
      radial-gradient(circle at 100% 10%, #201b45 0%, transparent 35%),
      var(--bg);
    color:var(--ivory);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  .icon{ width:18px; height:18px; display:inline-block; vertical-align:middle; flex-shrink:0; }
  .icon svg{ width:100%; height:100%; display:block; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 20px 0; max-width: 820px; margin: 0 auto;
  }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand .mark{
    width:38px; height:38px; border-radius:11px;
    background: linear-gradient(135deg, var(--amber-2), #d9822b);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 14px #f2a54140; color:#1a1206;
  }
  .brand .mark .icon{ width:20px; height:20px; }
  .brand .name{ font-family: var(--font-display); font-weight:700; font-size:17px; letter-spacing:.2px; }
  .topbar-actions{ display:flex; gap:8px; }
  .icon-btn{
    width:38px; height:38px; border-radius: 11px; border:1px solid var(--line);
    background: var(--panel); color: var(--muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition: all .15s ease;
  }
  .icon-btn:hover{ background: var(--panel-2); color:var(--ivory); transform: translateY(-1px); }
  .icon-btn.spinning .icon{ animation: spin .8s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .settings-panel{ max-width: 820px; margin: 10px auto 0; padding: 0 20px; }
  .settings-inner{
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; display:flex; align-items:center; justify-content:space-between; gap: 12px;
    max-height:0; overflow:hidden; opacity:0; padding-top:0; padding-bottom:0; margin-top:0;
    transition: all .25s ease;
  }
  .settings-panel.open .settings-inner{
    max-height:100px; opacity:1; padding-top:16px; padding-bottom:16px; margin-top:10px;
  }
  .settings-row-label{ font-size:13px; color: var(--muted); }
  .lang-toggle{ display:flex; background: #10142a; border-radius: 999px; padding: 3px; border:1px solid var(--line); }
  .lang-toggle button{
    border:none; background:transparent; color: var(--muted); padding: 7px 16px;
    border-radius: 999px; font-size: 13px; font-weight:600; cursor:pointer; transition: all .18s ease;
  }
  .lang-toggle button.active{ background: var(--amber); color: #1a1206; }

  .hero{ max-width: 820px; margin: 0 auto; padding: 26px 20px 4px; text-align:center; }
  .hero .eyebrow{ letter-spacing: 3px; font-size: 11px; color: var(--amber); text-transform:uppercase; font-weight:700; }
  .hero h1{
    font-family: var(--font-display);
    font-size: 30px; margin: 10px 0 6px; font-weight: 700; letter-spacing: -.3px;
    background: linear-gradient(90deg, var(--ivory), var(--amber-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p{ color: var(--muted); font-size: 13.5px; margin:0; }

  .stats-row{
    display:flex; gap:10px; justify-content:center; margin-top: 18px; flex-wrap:wrap;
  }
  .stat-chip{
    background: var(--panel); border:1px solid var(--line); border-radius: 999px;
    padding: 7px 14px; font-size: 12px; color: var(--muted); display:flex; align-items:center; gap:6px;
  }
  .stat-chip b{ color: var(--ivory); font-size:13px; }
  .stat-chip .icon{ width:13px; height:13px; color: var(--amber); }
  .stat-chip .dot{ width:7px; height:7px; border-radius:50%; background: var(--good); }
  .stat-chip .dot.err{ background: var(--danger); }

  .wrap{ max-width: 820px; margin: 0 auto; padding: 0 20px 60px; }

  .searchbar{
    margin-top:20px; display:flex; align-items:center; gap:10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 16px;
  }
  .searchbar .icon{ color: var(--muted); width:17px; height:17px; }
  .searchbar input{
    flex:1; background:none; border:none; outline:none; color: var(--ivory); font-size: 14px;
    font-family: inherit;
  }
  .searchbar input::placeholder{ color: var(--muted); }

  .status{
    margin-top:14px; padding: 12px 16px; border-radius: 12px;
    background: var(--panel); border:1px solid var(--line);
    font-size: 13px; color: var(--muted); text-align:center;
  }
  .status.error{ color: var(--danger); border-color: #e2685b55; background: #e2685b0d; }

  .shelf-title{
    text-transform: uppercase; letter-spacing: 1.5px; font-size: 11px; font-weight:700;
    color: var(--muted); margin: 26px 0 12px 2px; display:flex; justify-content:space-between; align-items:center;
  }
  .shelf-title .count{ color: var(--amber); }

  #list{ display:flex; flex-direction:column; gap:6px; }
  .group-heading{
    font-family: var(--font-display);
    font-size: 13px; font-weight:700; color: var(--amber);
    text-transform: uppercase; letter-spacing: 1px;
    margin: 18px 2px 4px;
  }
  .group-heading:first-child{ margin-top: 4px; }
  .group-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap:12px; margin-bottom: 6px;
  }
  .book{
    position:relative; overflow:hidden;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; cursor:pointer;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    animation: rise .35s ease both;
  }
  @keyframes rise{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .book:hover{
    transform: translateY(-3px);
    border-color: var(--amber);
    box-shadow: 0 10px 24px #00000055;
  }
  .book::after{
    content:""; position:absolute; inset:0;
    background: linear-gradient(135deg, var(--amber-dim), transparent 60%);
    opacity:0; transition: opacity .18s ease;
  }
  .book:hover::after{ opacity:1; }
  .book .spine{
    width:40px; height:40px; border-radius:11px; background: var(--amber-dim); color: var(--amber-2);
    display:flex; align-items:center; justify-content:center; margin-bottom:12px;
  }
  .book .spine .icon{ width:20px; height:20px; }
  .book .name{ font-family: var(--font-display); font-size: 14.5px; font-weight:600; line-height:1.3; margin-bottom:6px; word-break:break-word; }
  .book .meta{ font-size: 11px; color: var(--muted); display:flex; align-items:center; gap:6px; }
  .book .meta .icon{ width:12px; height:12px; }
  .book .go{
    position:absolute; right:14px; bottom:14px; font-size:13px; color: var(--amber); font-weight:600;
    opacity:0; transform: translateX(-4px); transition: all .18s ease;
  }
  .book:hover .go{ opacity:1; transform:translateX(0); }

  .back-btn{
    cursor:pointer; color: var(--amber); font-size:13px; font-weight:700;
    margin: 4px 2px 16px; display:inline-flex; align-items:center; gap:6px;
    user-select:none;
  }
  .back-btn:hover{ color: var(--amber-2); }
  .back-btn .icon{ width:14px; height:14px; }

  .subject-card .spine{ background: var(--amber-dim); }

  .skeleton{
    background: var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; height:104px;
    position:relative; overflow:hidden;
  }
  .skeleton::after{
    content:""; position:absolute; inset:0;
    background: linear-gradient(90deg, transparent, #ffffff0c, transparent);
    animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer{ from{ transform: translateX(-100%);} to{ transform: translateX(100%);} }

  .empty{
    grid-column: 1/-1;
    color: var(--muted); font-size: 13px; text-align:center; padding: 32px 20px;
    border: 1px dashed var(--line); border-radius: var(--radius);
  }
  .empty .icon{ width:30px; height:30px; margin:0 auto 10px; color: var(--line); display:block; }

  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    width:100%; max-width:360px; background: var(--panel); border:1px solid var(--line);
    border-radius: var(--radius); padding:28px 24px; text-align:center;
  }
  .login-card .mark{
    width:48px; height:48px; border-radius:14px; margin:0 auto 14px;
    background: linear-gradient(135deg, var(--amber-2), #d9822b); color:#1a1206;
    display:flex; align-items:center; justify-content:center;
  }
  .login-card .mark .icon{ width:24px; height:24px; }
  .login-card h2{ font-family: var(--font-display); margin: 0 0 6px; font-size:20px; font-weight:700; }
  .login-card p{ color:var(--muted); font-size:12.5px; margin:0 0 20px; }
  .login-field{ text-align:left; margin-bottom:12px; }
  .login-field label{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:6px; }
  .login-field input{
    width:100%; background:#10142a; border:1px solid var(--line); border-radius:10px;
    padding:11px 13px; color:var(--ivory); font-size:14px; font-family:inherit; outline:none;
  }
  .login-field input:focus{ border-color: var(--amber); }
  .login-btn{
    width:100%; margin-top:8px; padding:12px; border:none; border-radius:10px;
    background: var(--amber); color:#1a1206; font-weight:700; font-size:14px; cursor:pointer;
    transition: transform .15s ease;
  }
  .login-btn:hover{ transform: translateY(-1px); }
  .login-error{
    margin-top:12px; color: var(--danger); font-size:12.5px; display:none;
  }
  .logout-btn{
    border:none; background:transparent; color: var(--danger); font-size:13px; font-weight:600;
    cursor:pointer; padding:0;
  }
</style>
</head>

function iconForFile(f){
  if(f.type === 'pdf') return ICONS.pdf;
  if(f.type === 'image') return ICONS.image;
  return ICONS.file;
}

function applyLang(){
  const t = i18n[currentLang];

    const key = el.getAttribute('data-i18n');

  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{

document.getElementById('settingsBtn').addEventListener('click', ()=>{

});

document.getElementById('btnHI').addEventListener('click', ()=>{ currentLang='hi'; localStorage.setItem('lang','hi'); applyLang(); render(); });
document.getElementById('refreshBtn').addEventListener('click', loadFiles);

  searchTerm = e.target.value.trim().toLowerCase();

function setStatus(msg, isError){
  const el = document.getElementById('status');
  if(!msg){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
}

function showSkeletons(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  for(let i=0;i<6;i++){
    const s = document.createElement('div');
    s.className = 'skeleton';
    list.appendChild(s);
  }
}

const FOLDER_MIME = 'application/vnd.google-apps.folder';

// Which file types show up in the library, and how to recognize each one
// (either by Drive's mimeType or by filename extension as a fallback).
const FILE_MATCHERS = [
  { type: 'html',  mimes: ['text/html'], ext: /\.html?$/i },
  { type: 'pdf',   mimes: ['application/pdf'], ext: /\.pdf$/i },
  { type: 'image', mimes: ['image/png','image/jpeg','image/gif','image/webp'], ext: /\.(png|jpe?g|gif|webp)$/i }
];

function detectFileType(f){
  for(const m of FILE_MATCHERS){
    if(m.mimes.includes(f.mimeType) || m.ext.test(f.name)) return m.type;
  }
  return null;
}

async function fetchFolderChildren(folderId){
  const q = encodeURIComponent(`'${folderId}' in parents and trashed = false`);
  const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,mimeType,modifiedTime)&key=${API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.files || [];
}

// Recursively walk the folder tree (up to a safe depth) and collect
// html test files, tagging each with the subject (its parent folder name).
async function collectFilesRecursively(folderId, subjectName, depth){
  if(depth > 4) return [];
  const children = await fetchFolderChildren(folderId);
  let results = [];
  const subfolders = children.filter(f => f.mimeType === FOLDER_MIME);
  const files = children.filter(f =>
    f.mimeType !== FOLDER_MIME && detectFileType(f)
  );
  files.forEach(f => results.push({ ...f, subject: subjectName, type: detectFileType(f) }));
  for(const sub of subfolders){
    const nested = await collectFilesRecursively(sub.id, sub.name, depth + 1);
    results = results.concat(nested);
  }
  return results;
}

function naturalSort(a, b){
  return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
}

async function loadFiles(){
  const t = i18n[currentLang];
  const refreshBtn = document.getElementById('refreshBtn');
  if(!API_KEY || API_KEY.includes('PASTE_')){
    setStatus(t.errorKey, true);
    document.getElementById('statusDot').classList.add('err');
    return;
  }
  refreshBtn.classList.add('spinning');
  setStatus('', false);
  showSkeletons();
  try{
    // Top-level children of the shared folder: subfolders are "subjects",
    // loose files at the top level become a "General" subject.
    const topChildren = await fetchFolderChildren(FOLDER_ID);
    const subjectFolders = topChildren.filter(f => f.mimeType === FOLDER_MIME);
    const rootFiles = topChildren.filter(f =>
      f.mimeType !== FOLDER_MIME && detectFileType(f)
    );

    const subjects = [];
    for(const folder of subjectFolders){
      // Every subject folder is kept even if it currently has 0 test files,
      // so empty subjects still show up and can be opened.
      const files = await collectFilesRecursively(folder.id, folder.name, 0);
      files.sort(naturalSort);
      subjects.push({ id: folder.id, name: folder.name, files });
    }
    if(rootFiles.length){
      const files = rootFiles.map(f => ({ ...f, subject: t.general, type: detectFileType(f) }));
      files.sort(naturalSort);
      subjects.push({ id: '__root__', name: t.general, files });
    }
    subjects.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

    cachedSubjects = subjects;
    const totalFiles = subjects.reduce((sum, s) => sum + s.files.length, 0);
    document.getElementById('statusDot').classList.remove('err');
    document.getElementById('countNum').textContent = totalFiles;
    document.getElementById('lastSync').textContent = new Date().toLocaleTimeString(currentLang==='hi'?'hi-IN':'en-IN', {hour:'2-digit', minute:'2-digit'});
    render();
  }catch(err){
    console.error(err);
    setStatus(t.errorLoad, true);
    document.getElementById('statusDot').classList.add('err');
    document.getElementById('list').innerHTML = '';
  }finally{
    refreshBtn.classList.remove('spinning');
  }
}

function render(){
  if(searchTerm){
    renderSearchResults();
  } else if(currentSubject){
    renderSubjectTests(currentSubject);
  } else {
    renderSubjectsList();
  }
}

function buildBookCard(f, idx, icon){
  const div = document.createElement('div');
  div.className = 'book';
  div.style.animationDelay = (idx * 0.03) + 's';
  const date = new Date(f.modifiedTime).toLocaleDateString(currentLang==='hi' ? 'hi-IN':'en-IN');
  div.innerHTML = `
    <div class="spine"><span class="icon">${icon || iconForFile(f)}</span></div>
    <div class="name">${escapeHtml(f.name)}</div>
    <div class="meta"><span class="icon">${ICONS.clock}</span> ${date}</div>
    <div class="go">Open →</div>
  `;
  div.addEventListener('click', ()=>openFile(f));
  return div;
}

function renderSubjectsList(){
  const t = i18n[currentLang];
  const list = document.getElementById('list');
  document.querySelector('.shelf-title span').textContent = t.shelf;

  if(cachedSubjects.length === 0){
    list.innerHTML = `<div class="empty"><span class="icon">${ICONS.inbox}</span>${t.empty}</div>`;
    return;
  }
  list.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'group-grid';
  cachedSubjects.forEach((s, idx)=>{
    const div = document.createElement('div');
    div.className = 'book subject-card';
    div.style.animationDelay = (idx * 0.03) + 's';
    div.innerHTML = `
      <div class="spine"><span class="icon">${ICONS.subject}</span></div>
      <div class="name">${escapeHtml(s.name)}</div>
      <div class="meta">${s.files.length}${t.testsCount}</div>
      <div class="go">Open →</div>
    `;
    div.addEventListener('click', ()=>{ currentSubject = s; render(); });
    grid.appendChild(div);
  });
  list.appendChild(grid);
}

function renderSubjectTests(subject){
  const t = i18n[currentLang];
  const list = document.getElementById('list');
  document.querySelector('.shelf-title span').textContent = subject.name;
  list.innerHTML = '';

  const back = document.createElement('div');
  back.className = 'back-btn';
  back.innerHTML = `<span class="icon">${ICONS.back}</span>${t.back.replace('← ', '')}`;
  back.addEventListener('click', ()=>{ currentSubject = null; render(); });
  list.appendChild(back);

  if(subject.files.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `<span class="icon">${ICONS.inbox}</span>${t.emptySubject}`;
    list.appendChild(empty);
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'group-grid';
  subject.files.forEach((f, idx)=> grid.appendChild(buildBookCard(f, idx)));
  list.appendChild(grid);
}

function renderSearchResults(){
  const t = i18n[currentLang];
  const list = document.getElementById('list');
  document.querySelector('.shelf-title span').textContent = t.shelfTests;
  list.innerHTML = '';

  const allFiles = [];
  cachedSubjects.forEach(s => s.files.forEach(f => allFiles.push({ ...f, subject: s.name })));
  const filtered = allFiles.filter(f => f.name.toLowerCase().includes(searchTerm));

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty"><span class="icon">${ICONS.search}</span>${t.emptySearch}</div>`;
    return;
  }

  const groups = {};
  filtered.forEach(f=>{
    if(!groups[f.subject]) groups[f.subject] = [];
    groups[f.subject].push(f);
  });

  let idx = 0;
  Object.keys(groups).sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })).forEach(subject=>{
    const heading = document.createElement('div');
    heading.className = 'group-heading';
    heading.textContent = subject;
    list.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'group-grid';
    groups[subject].forEach(f=>{ grid.appendChild(buildBookCard(f, idx)); idx++; });
    list.appendChild(grid);
  });
}

async function openFile(file){
  alert('DEBUG - tapped: ' + file.name + ' (type: ' + file.type + ')'); // TEMPORARY DEBUG
  const url = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${API_KEY}`;
  try{
    if(file.type === 'html'){
      // Fetch (background request) — Google treats this as normal app
      // traffic. Then render the fetched HTML by rewriting the CURRENT
      // document in place (no navigation to the API URL, no blob: URL
      // navigation) — this is what works reliably both in mobile
      // browsers and inside WebView-based APK shells.
      const res = await fetch(url);
      if(!res.ok) throw new Error('fetch failed: ' + res.status);
      const html = await res.text();
      document.open();
      document.write(html);
      document.close();
    } else {
      // PDFs and images: fetch as a blob and embed it inline on a fresh
      // page (again, no top-level navigation to the API URL or to the
      // blob itself — just an <embed>/<img> referencing the blob).
      const res = await fetch(url);
      if(!res.ok) throw new Error('fetch failed: ' + res.status);
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      document.open();
      if(file.type === 'pdf'){
        document.write(`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0"><embed src="${objUrl}" type="application/pdf" style="width:100vw;height:100vh;border:none;"></body></html>`);
      } else {
        document.write(`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;background:#0b0e1c;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="${objUrl}" style="max-width:100%;height:auto;"></body></html>`);
      }
      document.close();
    }
  }catch(err){
    console.error(err);
    alert('DEBUG - openFile error:\n' + err.message); // TEMPORARY DEBUG
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

const TOKEN_KEY = 'test_library_session_token';
const USER_KEY = 'test_library_session_user';
let sessionCheckTimer = null;

function setLoginBusy(busy){
  const btn = document.querySelector('#loginForm .login-btn');
  btn.disabled = busy;
  btn.style.opacity = busy ? '0.6' : '1';
}

function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const saved = localStorage.getItem('lang');
  if(saved === 'hi' || saved === 'en') currentLang = saved;
  applyLang();
  loadFiles();
  startSessionWatch();
}

function showLogin(kickedOut){
  clearInterval(sessionCheckTimer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  const errorEl = document.getElementById('loginError');
  if(kickedOut){
    errorEl.textContent = currentLang === 'hi'
      ? 'किसी और डिवाइस पर लॉगिन होने की वजह से यह सेशन बंद कर दिया गया।'
      : 'You were logged out because someone logged in elsewhere with the same details.';
    errorEl.style.display = 'block';
  }
}

let jsonpCounter = 0;
function sessionApi(params){
  return new Promise((resolve, reject)=>{
    const cbName = 'sessionApiCb_' + (jsonpCounter++) + '_' + Date.now();
    const timeoutId = setTimeout(()=>{
      cleanup();
      reject(new Error('timeout'));
    }, 10000);

    const script = document.createElement('script');

    function cleanup(){
      clearTimeout(timeoutId);
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = (data)=>{
      cleanup();
      resolve(data);
    };

    const query = new URLSearchParams({ ...params, callback: cbName }).toString();
    script.src = SESSION_API_URL + '?' + query;
    script.onerror = ()=>{
      cleanup();
      reject(new Error('script load failed'));
    };
    document.body.appendChild(script);
  });
}

async function startSessionWatch(){
  clearInterval(sessionCheckTimer);
  sessionCheckTimer = setInterval(async ()=>{
    const token = localStorage.getItem(TOKEN_KEY);
    const username = localStorage.getItem(USER_KEY);
    if(!token || !username) return;
    try{
      const data = await sessionApi({ action: 'check', token, username });
      if(!data.valid){
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);
        showLogin(true);
      }
    }catch(err){
      console.error('session check failed', err);
    }
  }, 20000); // re-check every 20s so a takeover elsewhere gets noticed quickly
}

document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errorEl = document.getElementById('loginError');
  errorEl.style.display = 'none';

  if(!SESSION_API_URL || SESSION_API_URL.includes('PASTE_')){
    errorEl.textContent = currentLang === 'hi'
      ? 'पहले session-lock-appscript.gs सेटअप करके उसका URL कोड में डालिए।'
      : 'Set up session-lock-appscript.gs first and paste its URL in the code.';
    errorEl.style.display = 'block';
    return;
  }

  setLoginBusy(true);
  try{
    const data = await sessionApi({ action: 'login', username: user, password: pass });
    if(data.ok){
      localStorage.setItem(TOKEN_KEY, data.token);
      localStorage.setItem(USER_KEY, user);
      showApp();
    }else{
      errorEl.textContent = i18n[currentLang].loginError;
      errorEl.style.display = 'block';
    }
  }catch(err){
    console.error(err);
    errorEl.textContent = currentLang === 'hi'
      ? 'लॉगिन सर्वर से संपर्क नहीं हो पाया।'
      : 'Could not reach the login server.';
    errorEl.style.display = 'block';
  }finally{
    setLoginBusy(false);
  }
});

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  const token = localStorage.getItem(TOKEN_KEY);
  const username = localStorage.getItem(USER_KEY);
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
  try{ if(token && username) await sessionApi({ action: 'logout', token, username }); }catch(err){ console.error(err); }
  location.reload();
});

(async function initAuth(){
  const saved = localStorage.getItem('lang');
  if(saved === 'hi' || saved === 'en') currentLang = saved;
  applyLang();

  const token = localStorage.getItem(TOKEN_KEY);
  const username = localStorage.getItem(USER_KEY);
  if(!token || !username) return;
  if(!SESSION_API_URL || SESSION_API_URL.includes('PASTE_')){ return; }
  try{
    const data = await sessionApi({ action: 'check', token, username });
    if(data.valid){
      showApp();
    }else{
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
    }
  }catch(err){
    console.error('session check failed', err);
  }
})();
